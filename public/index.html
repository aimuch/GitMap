<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitMap</title>
  <link rel="icon" type="image/png" href="/resources/icon.png" />
  <link rel="stylesheet" href="/webview-theme.css" />
  <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="vscode-dark theme-dark">
  <div id="appShell">
    <!-- Top Title / Command Bar -->
    <header id="topBar">
      <div class="topbar-left">
        <button id="toggleSidebarBtn" class="icon-btn" title="Toggle Sidebar (Cmd/Ctrl+B)" aria-label="Toggle Sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><line x1="6" y1="2.5" x2="6" y2="13.5"/></svg>
        </button>
        <div class="brand">
          <img src="/resources/icon.png" alt="GitMap" class="brand-icon" />
          <span class="brand-name">GitMap</span>
        </div>
        <div id="activeRepoBadge" class="repo-location-pill hidden" title="Click to copy repository path"></div>
      </div>

      <div class="topbar-right">
        <button id="btnAddLocal" class="top-pill-btn">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.8h4.5A1.5 1.5 0 0 1 14 6.3v6.2a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5z"/></svg>
          <span data-i18n="addLocal">本地仓库</span>
        </button>
        <button id="btnConnectSsh" class="top-pill-btn primary-pill">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4L1.5 7.5 5 11"/><path d="M11 5l3.5 3.5L11 12"/><line x1="2" y1="7.5" x2="9" y2="7.5"/><line x1="7" y1="8.5" x2="14" y2="8.5"/></svg>
          <span data-i18n="remoteSsh">Remote - SSH</span>
        </button>
        <button id="btnToggleTerminal" class="top-pill-btn" title="Toggle Integrated Terminal (Ctrl+`)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M4.8 6l2.5 2-2.5 2"/><line x1="8.2" y1="10" x2="11.2" y2="10"/></svg>
          <span data-i18n="terminal">终端</span>
        </button>
        <button id="btnAppSettings" class="icon-btn" title="Application Settings">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg>
        </button>
        <button id="btnToggleLang" class="text-chip-btn" title="Switch Language">中文</button>
        <button id="btnToggleTheme" class="icon-btn" title="Toggle Dark / Light Theme">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </header>

    <!-- Main Body Split: Sidebar + Workspace -->
    <div id="mainSplit">
      <aside id="sidebar">
        <!-- Local Repositories -->
        <section class="sidebar-section">
          <div class="sidebar-section-header">
            <span data-i18n="localRepos">本地仓库</span>
            <button id="sidebarAddLocalBtn" class="mini-icon-btn" title="Add Local Repository">+</button>
          </div>
          <div id="localRepoList" class="sidebar-list"></div>
        </section>

        <!-- Remote (SSH) Repositories -->
        <section class="sidebar-section">
          <div class="sidebar-section-header">
            <span data-i18n="remoteRepos">远程仓库 (SSH)</span>
            <button id="sidebarAddRemoteBtn" class="mini-icon-btn" title="Browse Remote Repository Paths">+</button>
          </div>
          <div id="remoteRepoList" class="sidebar-list"></div>
        </section>

        <!-- SSH Hosts (~/.ssh/config & Saved) -->
        <section class="sidebar-section">
          <div class="sidebar-section-header">
            <span data-i18n="sshHosts">SSH 主机 (~/.ssh/config)</span>
            <button id="sidebarRefreshSshBtn" class="mini-icon-btn" title="Manage / Refresh SSH Hosts">⇄</button>
          </div>
          <div id="sshHostList" class="sidebar-list"></div>
        </section>
      </aside>

      <!-- Workspace Area: Tabs + Content + Bottom Terminal -->
      <main id="workspaceArea">
        <div id="tabBar" role="tablist"></div>

        <div id="tabPanels">
          <!-- Permanent Git Map Graph Panel -->
          <div id="panel-graph" class="tab-panel active">
            <iframe id="gitMapFrame" src="/webview/git-map" title="Git Map Graph"></iframe>
          </div>
          <!-- Dynamic Diff / File / VisualHistory panels appended here -->
        </div>

        <!-- Bottom Collapsible Integrated Terminal Drawer -->
        <section id="terminalDrawer" class="hidden">
          <div id="terminalResizer"></div>
          <div class="terminal-header">
            <div id="terminalTabs" class="terminal-tabs"></div>
            <div class="terminal-actions">
              <button id="btnNewRepoTerm" class="mini-btn" data-i18n="newRepoShell">+ 当前仓库终端</button>
              <button id="btnOpenSysTerm" class="mini-btn" data-i18n="openSysTerm">↗ 系统终端</button>
              <button id="btnCloseTermDrawer" class="mini-icon-btn" title="Hide Terminal">✕</button>
            </div>
          </div>
          <div id="terminalContainers" class="terminal-containers"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Remote - SSH Host Manager & Path Browser Modal -->
  <div id="sshModal" class="modal-backdrop hidden">
    <div class="modal-window modal-xl">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="remote-badge">SSH</span>
          <h3 data-i18n="sshModalTitle">Remote - SSH 远程仓库路径浏览</h3>
        </div>
        <button class="icon-btn modal-close" data-close="sshModal">✕</button>
      </div>
      <div class="ssh-modal-body">
        <!-- Left Column: SSH Hosts & Add Form -->
        <div class="ssh-hosts-pane">
          <div class="pane-toolbar">
            <strong data-i18n="sshServers">SSH 服务器</strong>
            <button id="btnShowAddHostForm" class="mini-btn primary">+ <span data-i18n="newHost">新增主机</span></button>
          </div>
          <div id="modalSshHostList" class="modal-host-list"></div>

          <form id="sshHostForm" class="ssh-host-form hidden">
            <h4 data-i18n="configureSshHost">配置 SSH 连接</h4>
            <label><span data-i18n="aliasName">名称 / 别名</span><input type="text" id="sshFormName" placeholder="prod-server" required /></label>
            <div class="form-row-2">
              <label><span data-i18n="hostIp">主机 / IP</span><input type="text" id="sshFormHost" placeholder="192.168.1.10" required /></label>
              <label style="max-width:92px;"><span data-i18n="port">端口</span><input type="number" id="sshFormPort" value="22" /></label>
            </div>
            <div class="form-row-2">
              <label><span data-i18n="username">用户名</span><input type="text" id="sshFormUser" placeholder="ubuntu / root" required /></label>
              <label><span data-i18n="authMethod">认证方式</span>
                <select id="sshFormAuth">
                  <option value="auto">Auto (Agent / Key / Password)</option>
                  <option value="key">SSH Private Key</option>
                  <option value="password">Password</option>
                  <option value="agent">SSH Agent</option>
                </select>
              </label>
            </div>
            <label id="sshKeyField"><span data-i18n="privateKeyPath">私钥路径 (可选)</span><input type="text" id="sshFormKey" placeholder="~/.ssh/id_ed25519" /></label>
            <label id="sshPasswordField"><span data-i18n="passwordOpt">密码 (可选，留空则在连接时询问)</span><input type="password" id="sshFormPassword" placeholder="••••••••" /></label>
            <div class="form-row-2">
              <label><span>ProxyJump (可选)</span><input type="text" id="sshFormJump" placeholder="bastion-host" /></label>
              <label><span data-i18n="defaultRemoteDir">默认远程目录</span><input type="text" id="sshFormDefaultPath" placeholder="~" /></label>
            </div>
            <div class="form-actions">
              <button type="button" id="btnCancelHostForm" class="mini-btn" data-i18n="cancel">取消</button>
              <button type="submit" class="mini-btn primary" data-i18n="saveAndBrowse">保存并浏览路径</button>
            </div>
          </form>
        </div>

        <!-- Right Column: Remote Directory & Git Repo Path Browser -->
        <div class="ssh-browser-pane">
          <div id="sshBrowserEmpty" class="browser-empty-state">
            <p data-i18n="selectHostHint">← 请在左侧选择一台 ~/.ssh/config 主机或新增 SSH 服务器，即可浏览远程目录路径并打开 Git 仓库。</p>
          </div>

          <div id="sshBrowserContent" class="ssh-browser-content hidden">
            <div class="remote-status-strip">
              <span id="sshConnSummary" class="conn-summary"></span>
              <div class="remote-strip-actions">
                <label class="inline-check"><input type="checkbox" id="sshShowHidden" /> <span data-i18n="showHidden">显示隐藏目录</span></label>
                <button id="btnScanRemoteRepos" class="mini-btn" data-i18n="scanSubfolders">扫描子目录 Git 仓库</button>
              </div>
            </div>

            <div class="path-nav-bar">
              <button id="btnSshUp" class="icon-btn" title="Parent Directory">↑</button>
              <button id="btnSshHome" class="icon-btn" title="Home Directory (~)">⌂</button>
              <input type="text" id="sshPathInput" class="path-input" placeholder="/home/user/projects" />
              <button id="btnSshGo" class="mini-btn primary" data-i18n="goPath">跳转</button>
              <button id="btnSshRefresh" class="icon-btn" title="Refresh">↻</button>
            </div>

            <div id="sshBreadcrumbs" class="breadcrumbs-bar"></div>

            <div id="sshCurrentRepoBanner" class="current-repo-banner hidden">
              <div class="banner-info">
                <span class="git-badge">Git Repo</span>
                <strong id="sshCurrentRepoPath"></strong>
                <span id="sshCurrentRepoBranch" class="branch-pill"></span>
              </div>
              <button id="btnOpenCurrentRemoteRepo" class="mini-btn primary" data-i18n="openCurrentRepo">打开此远程仓库</button>
            </div>

            <div id="sshDirList" class="dir-browser-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Local Repository / Directory Browser Modal -->
  <div id="localModal" class="modal-backdrop hidden">
    <div class="modal-window modal-lg">
      <div class="modal-header">
        <div class="modal-title-group">
          <h3 data-i18n="localModalTitle">添加本地 Git 仓库</h3>
        </div>
        <button class="icon-btn modal-close" data-close="localModal">✕</button>
      </div>
      <div class="local-modal-body">
        <div class="path-nav-bar">
          <button id="btnLocalUp" class="icon-btn" title="Parent Directory">↑</button>
          <button id="btnLocalHome" class="icon-btn" title="Home Directory (~)">⌂</button>
          <input type="text" id="localPathInput" class="path-input" placeholder="/Users/..." />
          <button id="btnLocalGo" class="mini-btn" data-i18n="goPath">跳转</button>
          <button id="btnNativePicker" class="mini-btn hidden" data-i18n="osFolderPicker">系统文件夹选择…</button>
          <button id="btnLocalScan" class="mini-btn" data-i18n="scanSubfolders">扫描子目录仓库</button>
        </div>
        <div class="local-filter-row">
          <div id="localBreadcrumbs" class="breadcrumbs-bar"></div>
          <label class="inline-check"><input type="checkbox" id="localShowHidden" /> <span data-i18n="showHidden">显示隐藏目录</span></label>
        </div>
        <div id="localCurrentRepoBanner" class="current-repo-banner hidden">
          <div class="banner-info">
            <span class="git-badge">Git Repo</span>
            <strong id="localCurrentRepoPath"></strong>
            <span id="localCurrentRepoBranch" class="branch-pill"></span>
          </div>
          <button id="btnOpenCurrentLocalRepo" class="mini-btn primary" data-i18n="openCurrentLocalRepo">添加并打开此仓库</button>
        </div>
        <div id="localDirList" class="dir-browser-list"></div>
      </div>
    </div>
  </div>

  <!-- Application Settings Modal -->
  <div id="appSettingsModal" class="modal-backdrop hidden">
    <div class="modal-window modal-md">
      <div class="modal-header">
        <h3 data-i18n="appSettingsTitle">GitMap 全局与 AI 设置</h3>
        <button class="icon-btn modal-close" data-close="appSettingsModal">✕</button>
      </div>
      <div class="settings-modal-body">
        <div class="settings-group">
          <h4 data-i18n="appearanceAndGraph">界面与图形</h4>
          <div class="form-row-2">
            <label><span data-i18n="displayLang">界面语言</span>
              <select id="cfgLanguage">
                <option value="Auto">Auto</option>
                <option value="Simplified Chinese">简体中文</option>
                <option value="English">English</option>
              </select>
            </label>
            <label><span data-i18n="colourPreset">图形配色预设</span>
              <select id="cfgColourPreset">
                <option value="Default">Default</option>
                <option value="Pastel">Pastel</option>
                <option value="Vivid">Vivid</option>
                <option value="High Contrast">High Contrast</option>
                <option value="Colour Blind Safe">Colour Blind Safe</option>
                <option value="Tokyo Subway">Tokyo Subway</option>
              </select>
            </label>
          </div>
          <div class="form-row-2">
            <label><span data-i18n="graphStyle">连线样式</span>
              <select id="cfgGraphStyle">
                <option value="rounded">Rounded (圆角)</option>
                <option value="angular">Angular (折线)</option>
              </select>
            </label>
            <label><span data-i18n="nodeStyle">节点样式</span>
              <select id="cfgNodeStyle">
                <option value="Dot">Dot (圆点)</option>
                <option value="Avatar">Avatar (头像)</option>
              </select>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <h4 data-i18n="aiSettingsHeader">AI 提交说明与提交解释</h4>
          <div class="form-row-2">
            <label><span>AI Provider</span>
              <select id="cfgAiProvider">
                <option value="DeepSeek">DeepSeek</option>
                <option value="Qwen">Qwen (通义千问)</option>
                <option value="Kimi">Kimi (Moonshot)</option>
                <option value="Doubao">Doubao (豆包)</option>
                <option value="OpenAI">OpenAI</option>
                <option value="Ollama">Ollama (Local)</option>
                <option value="OpenAI Compatible">OpenAI Compatible</option>
              </select>
            </label>
            <label><span>Model</span>
              <input type="text" id="cfgAiModel" placeholder="deepseek-chat / qwen-plus / gpt-4o-mini" />
            </label>
          </div>
          <label><span>API Base URL (可选)</span>
            <input type="text" id="cfgAiBaseUrl" placeholder="https://api.deepseek.com" />
          </label>
          <div class="checkbox-row">
            <label class="inline-check"><input type="checkbox" id="cfgAiExplain" /> <span>启用 AI 解释提交 (Explain Commit)</span></label>
            <label class="inline-check"><input type="checkbox" id="cfgAiCommitMsg" /> <span>启用 AI 生成提交信息</span></label>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="mini-btn modal-close" data-close="appSettingsModal" data-i18n="close">关闭</button>
          <button type="button" id="btnSaveAppSettings" class="mini-btn primary" data-i18n="saveSettings">保存设置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Generic Host Prompt Modal (InputBox / QuickPick / Confirmation / File Save) -->
  <div id="promptModal" class="modal-backdrop hidden" style="z-index: 900;">
    <div class="modal-window modal-sm">
      <div class="modal-header">
        <h3 id="promptTitle">GitMap</h3>
        <button id="promptCloseBtn" class="icon-btn">✕</button>
      </div>
      <div id="promptBody" class="prompt-body"></div>
      <div id="promptFooter" class="form-actions"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <script src="/vendor/xterm/xterm.js"></script>
  <script src="/vendor/xterm/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
